<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKS Trip 3 Negara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Direction: transit line. Full-bleed map, white signage panel, one coloured line per country, stops as stations. */
:root{
  color-scheme:light;
  --ink:#12161c; --mut:#667085; --hair:#e4e7ec; --bg:#fff; --soft:#f3f4f6; --desk:#0d1014;
  --my:#00a38d; --sg:#e5484d; --th:#f0a000; --c:var(--my);
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --cardw:268px;
}
.c-MY{--c:var(--my)}.c-SG{--c:var(--sg)}.c-TH{--c:var(--th)}.c-INK{--c:var(--ink)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--desk);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--sans);color:var(--ink);line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#app{position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:430px;transform:translateX(-50%);background:#dbe7ee;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 30px 80px rgba(0,0,0,.6)}

/* ---------- map ---------- */
#map{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;background:#dbe7ee}
#map.drag{cursor:grabbing}
#map.cut>*{animation:cutin .45s ease-out}
@keyframes cutin{from{opacity:.25}}
.msvg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#landsvg{z-index:0;transition:opacity .5s}
.tiled #landsvg{opacity:0}
#tiles{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;isolation:isolate}
.tl{position:absolute;left:0;top:0;transform-origin:0 0}
.tl img{position:absolute;width:257px;height:257px;max-width:none;opacity:0;transition:opacity .35s;-webkit-user-drag:none}
.tl img.ok{opacity:1}
#mapsvg{z-index:2}
#overlay{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3}
.geo{position:absolute;left:0;top:0;white-space:nowrap;translate:-50% -50%;font-family:var(--mono);font-size:.62rem;letter-spacing:.24em;color:rgba(18,22,28,.5)}
.tiled .geo{display:none}
.pin{position:absolute;left:0;top:0;width:0;height:0;z-index:2}
.mk{position:absolute;left:0;top:0;translate:-50% -50%;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--c);display:grid;place-items:center;pointer-events:auto;overflow:visible;
  box-shadow:0 1px 3px rgba(16,24,40,.35);transition:width .35s cubic-bezier(.3,1.5,.5,1),height .35s cubic-bezier(.3,1.5,.5,1),border-width .2s}
.mk img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;display:none;background:var(--soft)}
.mk b{position:relative;font-family:var(--mono);font-weight:700;font-size:.56rem;line-height:1;color:var(--ink)}
.pin.day{z-index:3}
.pin.day .mk{width:36px;height:36px}
.pin.day .mk img{display:block}
.pin.day .mk b{position:absolute;right:-7px;bottom:-5px;background:var(--c);color:#fff;border-radius:99px;padding:2px 4px;font-size:.52rem;box-shadow:0 0 0 2px #fff}
.pin.active{z-index:5}
.pin.active .mk{width:62px;height:62px;border-width:4px;box-shadow:0 8px 20px rgba(16,24,40,.4)}
.pin.active .mk::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--c);opacity:0;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{opacity:.8;scale:.8}100%{opacity:0;scale:1.25}}
.pin .lb{position:absolute;left:0;top:40px;translate:-50% 0;white-space:nowrap;background:var(--ink);color:#fff;font-weight:700;font-size:.72rem;padding:4px 9px;border-radius:99px;opacity:0;scale:.8;transition:opacity .25s,scale .25s;pointer-events:none}
.pin.active .lb{opacity:1;scale:1}
#bus{position:absolute;left:0;top:0;width:0;height:0;z-index:4}
#bus i{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 2px 6px rgba(16,24,40,.5)}
#bus.moving i{animation:beat .5s ease-in-out infinite}
@keyframes beat{50%{scale:1.25}}

/* ---------- top bar ---------- */
#top{position:absolute;left:0;right:0;top:0;z-index:10;display:flex;justify-content:center;padding:calc(10px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
#top img{display:block;height:72px;width:auto;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px rgba(255,255,255,.9))}
@keyframes pop{0%{scale:.6;opacity:0}100%{scale:1;opacity:1}}

/* ---------- onboarding ---------- */
#intro{position:absolute;inset:0;z-index:80;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(34px + env(safe-area-inset-top)) 26px calc(26px + env(safe-area-inset-bottom));text-align:center;transition:transform .7s cubic-bezier(.7,0,.2,1),opacity .5s .2s}
.started #intro{transform:translateY(-104%);opacity:0;pointer-events:none}
#intro .lg{width:112px;height:auto;display:block;margin:0 auto 26px;animation:rise .7s .05s both}
#intro .mid{width:100%}
#intro .lines{display:flex;justify-content:center;gap:6px;margin:0 0 20px;animation:rise .7s .15s both}
#intro .lines i{width:44px;height:6px;border-radius:6px;background:var(--c)}
#intro h1{font-stretch:125%;font-weight:900;font-size:clamp(2.3rem,13vw,3.4rem);line-height:.92;letter-spacing:-.02em;text-transform:uppercase;margin:0;animation:rise .7s .22s both}
#intro h1 em{font-style:normal;color:#c8303a}
#intro .where{font-family:var(--mono);font-weight:700;font-size:.68rem;letter-spacing:.14em;color:var(--mut);margin:20px 0 0;animation:rise .7s .3s both}
#intro .desc{font-size:1rem;color:#2a3038;margin:10px auto 0;max-width:26ch;animation:rise .7s .36s both}
#start{width:100%;height:60px;border-radius:18px;background:var(--ink);color:#fff;font-weight:800;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:10px;animation:rise .7s .45s both;transition:scale .15s}
#start:active{scale:.97}
#start i{font-style:normal;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{translate:4px 0}}

/* ---------- map controls ---------- */
#ctl{position:absolute;right:12px;z-index:10;display:flex;flex-direction:column;gap:8px;bottom:calc(var(--pad,260px) + 14px);transition:bottom .45s cubic-bezier(.2,.9,.25,1)}
#ctl button{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:1.25rem;font-weight:600;line-height:1;box-shadow:0 4px 14px rgba(16,24,40,.22)}
#ctl button:active{scale:.94}
#zreset{display:none!important;background:var(--ink)!important;color:#fff}
.manual #zreset{display:grid!important;animation:pop .35s both}
#attr{position:absolute;left:8px;z-index:9;transition:bottom .45s cubic-bezier(.2,.9,.25,1);bottom:calc(var(--pad,260px) + 6px);font-size:.52rem;color:var(--ink);background:rgba(255,255,255,.75);padding:1px 5px;border-radius:4px;max-width:60%}

/* ---------- the sheet: navigation on top, story below ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;height:60%;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:0 -10px 34px rgba(16,24,40,.22);display:flex;flex-direction:column;
  transform:translateY(calc(100% - var(--peek,260px)));transition:transform .45s cubic-bezier(.2,.9,.25,1)}
.expanded #sheet{transform:none}
#shead{flex:none}
#grab{display:block;width:100%;height:26px;position:relative;cursor:grab}
#sheet{cursor:grab}
#sheet.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
#sheet.dragging *{cursor:grabbing!important}
#grab::before{content:"";position:absolute;left:50%;top:10px;width:46px;height:5px;border-radius:9px;background:#d3d8df;translate:-50% 0;transition:width .25s,background .25s}
#grab:hover::before{width:60px;background:var(--mut)}
#points{overflow-x:auto;scrollbar-width:none;padding:6px 18px 12px}
#points::-webkit-scrollbar{display:none}
.ptrack{position:relative;display:inline-flex;align-items:center;min-width:100%;padding:4px 0}
.ptrack::before{content:"";position:absolute;left:24px;right:24px;top:50%;height:3px;margin-top:-1.5px;background:var(--hair);border-radius:3px}
.pt{position:relative;flex:none;margin-right:12px;width:34px;height:34px;border-radius:50%;background:#fff;border:2.5px solid var(--c);font-family:var(--mono);font-weight:700;font-size:.7rem;color:var(--ink);display:grid;place-items:center;transition:background .25s,color .25s,border-color .25s,scale .3s cubic-bezier(.3,1.6,.5,1)}
.pt.past{background:color-mix(in srgb,var(--c) 16%,#fff)}
.pt.on{background:var(--c);color:#fff;scale:1.12}
.pt.sum{width:auto;height:40px;padding:0 16px;border-radius:13px;font-family:var(--sans);font-size:.86rem;font-weight:700;white-space:nowrap;background:var(--soft);border-color:var(--soft);color:var(--mut)}
.pt.sum.past{background:var(--soft);color:var(--ink)}
.pt.sum.cur{background:#fff;border-color:var(--c);color:var(--ink)}
.pt.sum.on{background:var(--c);border-color:var(--c);color:#fff;scale:1}
.grp{display:inline-flex;align-items:center;max-width:0;opacity:0;visibility:hidden;overflow:hidden;padding:5px 0 5px 4px;margin-left:-4px;transition:max-width .5s cubic-bezier(.2,.9,.25,1),opacity .25s,visibility 0s .5s}
.grp.open{max-width:520px;opacity:1;visibility:visible;transition:max-width .5s cubic-bezier(.2,.9,.25,1),opacity .35s .12s,visibility 0s}
#sbody{flex:1;min-height:0;overflow:hidden;overscroll-behavior:contain;padding-bottom:22px}
.expanded #sbody{overflow-y:auto}
#sbody.swap .head,#sbody.swap .rest>*{animation:rise .45s cubic-bezier(.2,.9,.25,1) both}
#sbody.swap .rest>*:nth-child(1){animation-delay:.06s}#sbody.swap .rest>*:nth-child(2){animation-delay:.1s}#sbody.swap .rest>*:nth-child(3){animation-delay:.14s}#sbody.swap .rest>*:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;translate:0 14px}}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start;padding:12px 20px 0;min-height:166px}
.expanded .head{min-height:0;padding-bottom:6px}
.kick{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-family:var(--mono);font-weight:700;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0}
.kick .ln{background:var(--c);color:#fff;border-radius:6px;padding:3px 7px 2px}
.head h2{font-stretch:112%;font-weight:900;font-size:1.5rem;line-height:1.05;letter-spacing:-.02em;margin:.38em 0 0;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.expanded .head h2{display:block;font-size:1.7rem}
.hint{display:inline-flex;align-items:center;gap:6px;margin-top:20px;font-size:.74rem;font-weight:600;color:var(--mut)}
.hint i{font-style:normal;animation:bobup 1.6s ease-in-out infinite}
@keyframes bobup{50%{translate:0 -3px}}
.expanded .hint{display:none}
.hthumb{width:76px;height:76px;border-radius:16px;object-fit:cover;background:var(--soft);display:block}
.peek{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;width:76px;height:76px}
.peek span{position:relative;border-radius:10px;overflow:hidden;background:var(--soft)}
.peek img{display:block;width:100%;height:100%;object-fit:cover}
.peek em{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,22,28,.62);color:#fff;font-style:normal;font-family:var(--mono);font-weight:700;font-size:.7rem}
.expanded .hthumb,.expanded .peek{display:none}
.rest{padding-top:12px}
.photos{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 20px 4px;scrollbar-width:none}
.photos::-webkit-scrollbar{display:none}
.photos button{flex:0 0 86%;scroll-snap-align:center;border-radius:18px;overflow:hidden;background:var(--soft);cursor:zoom-in;position:relative}
.photos img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.photos button::after{content:"⤢";position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:rgba(18,22,28,.6);color:#fff;display:grid;place-items:center;font-size:.85rem}
.dots{display:flex;justify-content:center;gap:5px;padding:10px 0 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--hair);transition:all .25s}
.dots i.on{width:18px;background:var(--c);border-radius:9px}
.story{padding:16px 20px 0}
.story p.tx{font-size:1.02rem;line-height:1.55;margin:0 0 1em;color:#2a3038}
.tip{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:color-mix(in srgb,var(--c) 10%,#fff);border-radius:14px;padding:12px 14px;margin:0 0 1.1em;font-size:.9rem;line-height:1.45}
.tip b{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--c);padding-top:3px;filter:brightness(.8)}
.ig{display:flex;align-items:center;gap:12px;margin:0 0 1.1em;padding:12px 14px;border:1.5px solid var(--hair);border-radius:14px;text-decoration:none;color:var(--ink);transition:border-color .2s,background .2s}
.ig:hover,.ig:active{border-color:var(--ink);background:var(--soft)}
.ig svg{flex:none;width:26px;height:26px}
.ig span{flex:1;min-width:0;font-weight:700;font-size:.92rem;line-height:1.25}
.ig small{display:block;font-family:var(--mono);font-weight:500;font-size:.66rem;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ig b{font-weight:600;font-size:1rem}
.facts{margin:0;border-top:1px solid var(--hair)}
.facts div{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--hair);font-size:.88rem}
.facts dt{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding-top:3px}
.facts dd{margin:0;font-weight:600}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-stretch:112%;font-weight:900;font-size:1.15rem;letter-spacing:-.01em;line-height:1.1;margin:30px 0 6px}
.sect span{font-family:var(--mono);font-stretch:100%;font-weight:700;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.stoplist{list-style:none;margin:6px 0 0;padding:0}
.stoplist button{display:grid;grid-template-columns:28px 48px 1fr auto;gap:12px;align-items:center;width:100%;padding:9px 0;border-bottom:1px solid var(--hair)}
.sect+.stoplist{border-top:1px solid var(--hair)}
.stoplist .n{font-family:var(--mono);font-weight:700;font-size:.72rem;color:var(--c)}
.stoplist img{width:48px;height:48px;border-radius:11px;object-fit:cover;background:var(--soft)}
.stoplist .sq{width:48px;height:48px;border-radius:11px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:.74rem}
.stoplist b{font-weight:700;font-size:.94rem;line-height:1.2}
.stoplist small{display:block;font-weight:500;font-size:.74rem;color:var(--mut);margin-top:2px}
#sfoot{flex:none;background:#fff;border-top:1px solid var(--hair);padding:10px 18px calc(12px + env(safe-area-inset-bottom))}
.snav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.snav button{border-radius:14px;padding:9px 14px;background:var(--soft);min-width:0}
.snav button:last-child{background:var(--ink);color:#fff;text-align:right}
.snav small{display:block;font-family:var(--mono);font-size:.56rem;letter-spacing:.1em;opacity:.7;margin-bottom:2px}
.snav b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snav button[disabled]{opacity:.35;cursor:default}

/* ---------- lightbox ---------- */
#lb{position:absolute;inset:0;z-index:60;background:#07090b;display:flex;flex-direction:column;animation:fade .2s}
#lb[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.lbtop{flex:none;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;color:#fff;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em}
.lbtop button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font-size:1.1rem}
.lbmid{flex:1;min-height:0;position:relative;display:grid;place-items:center;touch-action:pan-y}
#lb-img{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
#lb-img.swap{animation:lbin .3s ease-out}
@keyframes lbin{from{opacity:0;translate:var(--from,30px) 0}}
.lbnav{position:absolute;top:50%;translate:0 -50%;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-size:1.3rem}
#lb-prev{left:8px}#lb-next{right:8px}
.lbcap{flex:none;color:#fff;padding:10px 16px calc(16px + env(safe-area-inset-bottom));font-weight:700;font-size:.95rem}
.lbcap small{display:block;font-family:var(--mono);font-weight:500;font-size:.6rem;letter-spacing:.08em;opacity:.6;margin-top:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

rs, Midvalley Megamall.jpg", "Nyonya kuih, Ipoh, Malaysia.jpg", "Kuih Lapis.jpg"]}, {"d": 2, "c": "MY", "name": "Istana Negara", "s": "Istana Negara", "tag": "Photo stop", "text": "Kediaman resmi Yang di-Pertuan Agong, raja Malaysia. Kita foto dari depan gerbang utamanya yang megah.", "tip": "Hanya berhenti untuk foto, pengunjung tidak masuk ke dalam.", "ig": "istananegara", "x": 316.74, "y": 516.78, "imgs": ["Kuala Lumpur Malaysia-Istana Negara-Jalan-Duta-01.jpg", "Kuala Lumpur Malaysia-Istana Negara-Jalan-Duta-02.jpg", "Kuala Lumpur Malaysia-Istana Negara-Jalan-Duta-03.jpg"]}, {"d": 2, "c": "MY", "name": "KLCC & Menara Petronas", "s": "Menara Petronas", "tag": "Photo stop", "text": "Menara kembar 88 lantai yang jadi wajah Malaysia. Dulu sempat memegang gelar gedung tertinggi di dunia.", "tip": "Mundur agak jauh supaya dua menaranya masuk satu frame.", "ig": "klcc", "x": 321.12, "y": 516.96, "imgs": ["Petronas Panorama II.jpg", "Skybridge petronas twin towers kl.jpg", "Petronas twin towers.jpg"]}, {"d": 2, "c": "MY", "name": "Chocolate Factory", "s": "Chocolate Factory", "tag": "Belanja", "text": "Toko cokelat yang jadi langganan rombongan tur. Bisa icip dulu sebelum memutuskan mau bawa pulang yang mana.", "tip": "Cokelat gampang leleh di bus. Simpan di tas yang tidak kena matahari.", "ig": "chocolatemalaysia", "x": 321.78, "y": 518.3, "imgs": ["Cocoa Boutique.JPG", "Beryl’s Chocolate Story, Kwai Chai Hong street.jpg", "Malaysian chocolates.JPG"]}, {"d": 2, "c": "MY", "name": "Putrajaya", "s": "Putrajaya", "tag": "Photo stop", "text": "Pusat pemerintahan Malaysia, kota yang ditata rapi di tepi danau. Ikonnya Masjid Putra dengan kubah merah muda.", "tip": "Lapangannya luas dan terik, topi dan kacamata hitam membantu.", "ig": "putrajaya", "x": 318.87, "y": 539.18, "imgs": ["Putrajaya Malaysia Putra-Mosque-03.jpg", "Putrajaya Malaysia Putra-Mosque-06.jpg", "PUTRA MOSQUE ARCHITECTURE.jpg"]}, {"d": 2, "c": "MY", "name": "Johor Bahru", "s": "Johor Bahru", "tag": "Mengina   addEventListener("pointermove",function(e){if(!m||e.pointerId!==m.id)return;var dx=e.clientX-m.x,dy=e.clientY-m.y;
    if(!m.mode){if(Math.abs(dx)<6&&Math.abs(dy)<6)return;swallow=true;sheet.classList.add("dragging");
      if(Math.abs(dx)>Math.abs(dy)){m.mode=m.box?"x":"h";if(m.box)m.box.style.scrollSnapType="none"}
      else if(mayDrag(dy,sbody.scrollTop<=0,m.head)){m.mode="v";sheet.style.transition="none"}
      else m.mode="s"}
    if(m.mode==="s"){ // content scroll by dragging; hand over to the sheet once the top is reached
      if(sbody.scrollTop<=0&&e.clientY>m.ly){m.mode="v";m.y=e.clientY;sheet.style.transition="none";dy=0}
      else sbody.scrollTop-=e.clientY-m.ly}
    if(m.mode==="v"){var dt=e.timeStamp-m.lt;if(dt>0)m.vy=.7*((e.clientY-m.ly)/dt)+.3*m.vy;m.dy=e.clientY-m.y;place(m.dy)}
    else if(m.mode==="x")m.box.scrollLeft-=e.clientX-m.lx;
    m.lx=e.clientX;m.ly=e.clientY;m.lt=e.timeStamp;if(m.mode)e.preventDefault()});
  function mEnd(e){if(!m||e.pointerId!==m.id)return;var k=m.mode,dy=m.dy,vy=m.vy,dx=e.clientX-m.x,box=m.box;m=null;
    if(k==="v")settle(dy,vy);else sheet.classList.remove("dragging");
    if(k==="h"&&Math.abs(dx)>60)selectItem(active+(dx<0?1:-1));
    if(k==="x"&&box)box.style.scrollSnapType="";
    setTimeout(function(){swallow=false},0)}
  addEventListener("pointerup",mEnd);addEventListener("pointercancel",mEnd);
  sheet.addEventListener("click",function(e){if(swallow){e.stopPropagation();e.preventDefault()}},true);
  sheet.addEventListener("dragstart",function(e){e.preventDefault()});

  /* wheel and trackpad */
  var wl=0;sheet.addEventListener("wheel",function(e){var now=Date.now();if(now-wl<500)return;
    if(!expanded&&e.deltaY>6){wl=now;setExpanded(true)}else if(expanded&&sbody.scrollTop<=0&&e.deltaY<-6){wl=now;setExpanded(false)}},{passive:true});
})();

addEventListener("keydown",function(e){
  if(!lb.hidden){if(e.key==="Escape")closeLB();else if(e.key==="ArrowLeft")showLB(lbI-1,-1);else if(e.key==="ArrowRight")showLB(lbI+1,1);return}
  if(e.key==="Escape")setExpanded(false);else if(e.key==="ArrowRight")selectItem(active+1);else if(e.key==="ArrowLeft")selectItem(active-1);
  else if(e.key==="ArrowUp"&&!expanded){e.preventDefault();setExpanded(true)}else if(e.key==="ArrowDown"&&expanded&&sbody.scrollTop<=0){setExpanded(false)}
});
document.addEventListener("error",function(e){var t=e.target;if(!t||t.tagName!=="IMG"||t.src.indexOf("Special:FilePath")<0)return;
  var n=+(t.dataset.retry||0);if(n>=3)return;t.dataset.retry=n+1;var base=t.src.replace(/&r=\d+$/,"");setTimeout(function(){t.src=base+"&r="+(n+1)},1200*(n+1))},true);

$("#intro .lg").src=$("#top img").src;
$("#start").addEventListener("click",function(){app.classList.add("started");setTimeout(function(){var i=$("#intro");if(i)i.hidden=true},900)});

/* ================= start ================= */
function boot(){measure();apply(active<0?0:active,true,true)}
(function(){ // low-zoom backdrop for the whole route so fast travel never shows blank map
  var x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;legs.forEach(function(L){x1=Math.min(x1,L.x1);x2=Math.max(x2,L.x2);y1=Math.min(y1,L.y1);y2=Math.max(y2,L.y2)});
  var T=65536,k=T/36000,ax=Math.floor((x1*k+OXF*T)/256),ay=Math.floor((y1*k+OYF*T)/256),L8=layerFor(8,ax,ay);
  for(var tx=ax;tx<=Math.floor((x2*k+OXF*T)/256);tx++)for(var ty=ay;ty<=Math.floor((y2*k+OYF*T)/256);ty++)if(!L8.t[tx+"_"+ty])addTile(L8,tx,ty);
})();
boot();
addEventListener("resize",boot);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){measure()});
})();
</script>
